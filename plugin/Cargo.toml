[package]
name = "rackforge-concert-grand"
description = "Physically modelled grand piano RackForge ships in every host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rackforge-plugin-sdk.workspace = true

# Driver and host integration dependencies are opt-in; the piano itself
# builds and tests against the portable SDK alone.
cpal = { version = "0.16.0", optional = true }
midir = { version = "0.11", optional = true }
rackforge-core = { workspace = true, optional = true }
rackforge-plugin-api = { workspace = true, optional = true }
rackforge-plugin-runtime = { workspace = true, optional = true }
wasmtime = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
rackforge-ump = { workspace = true, optional = true }

[features]
default = []
lab = ["dep:cpal", "dep:midir", "dep:rackforge-ump"]
wasm-tests = ["dep:rackforge-plugin-runtime"]
host-tests = ["wasm-tests", "dep:rackforge-core", "dep:rackforge-plugin-api", "dep:wasmtime"]

[[example]]
name = "lab"
required-features = ["lab"]

[[example]]
name = "wasm-tax"
required-features = ["host-tests"]

[[test]]
name = "concert_grand_instantiates"
required-features = ["wasm-tests"]

[[test]]
name = "concert_grand_across_instances"
required-features = ["wasm-tests"]

[[test]]
name = "concert_grand_fuel"
required-features = ["wasm-tests"]
