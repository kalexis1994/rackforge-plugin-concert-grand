name: Concert Grand
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: concert-grand-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x86_64
            library: librackforge_concert_grand.so
          - runner: ubuntu-22.04-arm
            platform: linux-aarch64
            library: librackforge_concert_grand.so
          - runner: windows-2022
            platform: windows-x86_64
            library: rackforge_concert_grand.dll
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - name: Test the model
        run: cargo test --locked --release -p rackforge-concert-grand --lib -- --test-threads=1
      - name: Check exact audio fingerprints
        run: cargo test --locked --release -p rackforge-concert-grand --lib render_fingerprint -- --ignored --test-threads=1
      - name: Build the portable native library
        run: cargo build --locked --release -p rackforge-concert-grand
      - uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.platform }}
          path: target/release/${{ matrix.library }}
          if-no-files-found: error
  component:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
      - name: Build the component
        run: cargo build --locked --release --target wasm32-unknown-unknown -p rackforge-concert-grand
      - name: Test component startup and independent worker instances
        run: cargo test --locked --release --features wasm-tests --tests -- --test-threads=1
      - name: Compile the Python tools
        run: python3 -m compileall -q tools
      - uses: actions/upload-artifact@v6
        with:
          name: component
          path: target/wasm32-unknown-unknown/release/rackforge_concert_grand.wasm
          if-no-files-found: error
